[project]
name = "agent-bisect"
version = "0.1.0"
description = "Counterfactual replay for LLM agent failures."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # Range matches tau2-bench's own pin (vendor/tau2-bench pyproject.toml) so
  # the two coexist in one resolution; see docs/decisions/0003-tau2-pin.md.
  "litellm>=1.80.15,<1.82.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.13",
  "polars>=1.6",
  "duckdb>=1.0",
  "matplotlib>=3.9",
  "zstandard>=0.23",
  "tau2",
]

[project.scripts]
bisect = "agent_bisect.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-socket>=0.7",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_bisect"]

[tool.uv.sources]
tau2 = { path = "vendor/tau2-bench", editable = true }

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket -q --cov=agent_bisect --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
  "live: opt-in test that makes real network calls (deselected by default)",
]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["agent_bisect", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pyright]
include = ["agent_bisect", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true

[tool.importlinter]
root_package = "agent_bisect"

[[tool.importlinter.contracts]]
name = "core never imports attribution, bench, or gate"
type = "forbidden"
source_modules = ["agent_bisect.core"]
forbidden_modules = [
  "agent_bisect.attribution",
  "agent_bisect.bench",
  "agent_bisect.gate",
]
