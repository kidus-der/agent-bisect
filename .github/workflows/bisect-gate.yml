name: Bisect gate

# `pull_request`, never `pull_request_target`: a fork's PR runs with a
# read-only, repo-scoped GITHUB_TOKEN and no repository secrets, which is
# exactly the posture `mode: live` needs and never gets on a fork PR
# (docs/decisions/0019-gate-rule.md). Every value that could carry
# PR-controlled text (a branch name, a title) is read through `with:`/`env:`
# on the composite action's own inputs, never interpolated into a `run:`
# shell string in this file.
on:
  pull_request:
    paths:
      - "demo/**"
      - "agent_bisect/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bisect-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: `bisect gate` checks base and head out into their
          # own worktrees and diffs between them, both of which need more
          # than the PR merge commit a shallow checkout would give.
          fetch-depth: 0

      - name: Run the gate
        uses: ./.github/actions/bisect-gate
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          suite: demo
          runs: "4"
          mode: demo
          comment: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # mode is pinned to "demo" above: nvidia-api-key is deliberately
          # never wired to secrets.NVIDIA_API_KEY here. Wiring it in for a
          # future `mode: live` run must also gate on
          # `github.event.pull_request.head.repo.full_name ==
          # github.repository`, so a fork PR still never receives it.
